<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyCare - Login</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="preconnect" href="https://vlibras.gov.br">
</head>

<body>
    <header>
        <a href="index.html" class="logo-link">
            <img class="logo" src="../../imgs/logoEasyCareBranco.png" alt="EasyCare">
        </a>
        <nav>
            <a href="index.html">Sobre</a>
            <a class="ativo" href="login.html">Entrar</a>
            <a href="signup.html">Criar conta</a>
        </nav>
    </header>

    <main class="login-page">
        <form class="form-login" id="form-login">

            <input type="email" placeholder="E-mail" id="email" required>
            <input type="password" placeholder="Senha" id="senha" required>
            <button type="submit">Entrar</button>

            <p>
                Não tem conta?
                <a href="signup.html">Criar conta</a>
            </p>
        </form>
    </main>

    <div id="mensagem" style="color: white; font-size: 100px;"></div>

    <footer>
        <p>Todos os direitos reservados EasyCare 2026</p>
    </footer>

    <script src="../js/login.js"></script>

<div vw class="enabled">
<div vw-access-button class="active"></div>
<div vw-plugin-wrapper>
<div class="vw-plugin-top-wrapper"></div>
</div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"> </script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>
</body>
</html>
