<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyCare - Cadastro</title>
    <link rel="stylesheet" href="style-signup.css">
    <link rel="preconnect" href="https://vlibras.gov.br">
</head>

<body>

    <header>
        <div>
            <img class="logo" src="../imgs/logoazulepreto.png" alt="">
        </div>

        <nav>
            <a href="index.html">Sobre</a>
            <a href="login.html">Login</a>

            <span>+</span>
            <span>☰</span>
        </nav>
    </header>

    <main class="login-page">
        <form class="login-box signup-box" id="user-form">

            <input type="text" placeholder="Nome" id="nome" required>
            <input type="email" placeholder="E-mail" id="email" required>
            <input type="password" placeholder="Senha" id="senha" required>
            <button type="submit" id="btnCadastrar">Entrar</button>

            <p> Já tem conta? <a href="login.html">Fazer login</a></p>
        </form>


        <div id="mensagem" style="color: white; font-size: 100px;"></div>
    </main>

    <footer>
        <p>Todos os direitos reservados EasyCare 2026</p>
    </footer>


<script src="script.js"></script>

<div vw class="enabled">
<div vw-access-button class="active"></div>
<div vw-plugin-wrapper>
<div class="vw-plugin-top-wrapper"></div>
</div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"> </script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>
</body>
</html>
