<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyCare - Cadastro</title>
    <link rel="stylesheet" href="style-signup.css">
</head>

<body>

    <header>
        <div>
            <img class="logo" src="../imgs/logoazulepreto.png" alt="">
        </div>

        <nav>
            <a href="#">Sobre</a>
            <a href="#">Entrar em contato</a>
            <button>login</button>

            <span>+</span>
            <span>☰</span>
        </nav>
    </header>

    <main class="login-page">

        <form class="login-box signup-box">

            <input 
                type="text" 
                placeholder="Nome completo"
                required
            >

            <input 
                type="email" 
                placeholder="E-mail"
                required
            >

            <input 
                type="password" 
                placeholder="Senha"
                required
            >

            <button type="submit">Entrar</button>

            <p>
                Já tem conta?
                <a href="login.html">Fazer login</a>
            </p>

        </form>

    </main>

</body>
</html>
